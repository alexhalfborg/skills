# Engine-level defaults. Committed, and shared by every brand and campaign.
#
# NEVER put secrets here. fal.ai needs none: you connect it by signing in, not with a key.
# Type /mcp, choose fal-ai (under Halfborg Campaign Engine) and pick Authenticate.
# Run /halfborg-campaign:setup-engine for a walkthrough.
#
# This file is a dial, not a gate. It is optional, every value has a fallback in the skill
# that reads it, and precedence runs: invocation argument -> engine.yaml -> skill default.
# Delete it and nothing breaks; the skills just use their own defaults.
#
# Contract: schema/engine.schema.json in the halfborg-campaign plugin.

engine:
  version: 1

# Which model each render skill reaches for when the invocation does not name one.
# Ids are passed to the fal MCP verbatim — see https://fal.ai/models.
media:
  image_model: fal-ai/nano-banana-2
  video_model: bytedance/seedance-2.0/reference-to-video
  lockup_model: fal-ai/nano-banana-pro/edit  # must be edit-capable: reference image + prompt. Pro for typography
  reference_model: fal-ai/nano-banana-2/edit  # prepare-reference-kit identity stills; must be edit-capable

cost:
  currency: USD
  confirm_video_above: 0    # 0 = always confirm before spending
